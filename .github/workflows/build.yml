name: Сборка и проверки

# Нативный код проверяется на каждом коммите. Раньше CI не было
# вовсе — из-за этого в репозиторий попал код, который не собирался.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  hostcheck:
    name: Компиляция, линковка, тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка clang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang zlib1g-dev

      - name: Кэш зависимостей
        uses: actions/cache@v4
        with:
          path: third_party
          key: third-party-${{ hashFiles('tools/hostcheck/run.sh') }}

      # Компилирует все исходники, линкует libnative-lib.so с
      # -Wl,--no-undefined и прогоняет тесты логики.
      - name: hostcheck
        run: ./tools/hostcheck/run.sh

      - name: Лог компиляции при провале
        if: failure()
        run: cat build/hostcheck/compile.log || true

  shaders:
    name: Компиляция шейдеров
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка glslc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslc

      # Ошибка в шейдере не видна ни компилятору C++, ни тестам:
      # она всплыла бы только на устройстве чёрным экраном.
      - name: glslc
        run: |
          set -e
          mkdir -p build/shaders
          for f in app/src/main/cpp/shaders/*.vert app/src/main/cpp/shaders/*.frag; do
              [ -f "$f" ] || continue
              echo "  $(basename "$f")"
              glslc -O "$f" -o "build/shaders/$(basename "$f").spv"
          done
          echo "Скомпилировано: $(ls build/shaders | wc -l)"

  apk:
    name: Сборка APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # packages: '' — не ставить то, что действие ставит по умолчанию.
      #
      # По умолчанию это «tools platform-tools», а пакета tools в
      # репозитории Google больше нет: sdkmanager отвечает «Failed to
      # find package 'tools'» и роняет сборку APK на любой ветке, к
      # содержимому репозитория это отношения не имеет. Что нужно —
      # ставим сами строкой ниже; остальное уже есть в образе runner-а.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Установка NDK и platform-tools
        run: sdkmanager --install "platform-tools" "ndk;26.1.10909125" > /dev/null

      - name: Зависимости
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslc
          mkdir -p third_party
          git clone --depth=1 -q https://github.com/g-truc/glm.git third_party/glm
          git clone --depth=1 -q --branch v3.13.2 \
              https://github.com/skypjack/entt.git third_party/entt-src
          mkdir -p third_party/entt/include/entt
          cp third_party/entt-src/single_include/entt/entt.hpp \
             third_party/entt/include/entt/

      # Отдельного шага компиляции шейдеров здесь больше нет: их
      # собирает сама сборка APK (задача compileShaders в
      # app/build.gradle). Раньше шаг писал .spv в
      # app/src/main/assets/shaders, откуда gradle паковал каталог как
      # есть, — и туда же писали tools/vkcheck и tools/gpubench. Этого
      # хватило, чтобы APK уехал на устройство со старым шейдером.
      # glslc при этом по-прежнему нужен: его зовёт gradle.

      - name: gradle assembleDebug
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # APK, который собирается, но не запускается, выглядит как успех.
      # Проверяем то, из-за чего приложение падает сразу при старте:
      # отсутствие библиотеки, отсутствие шейдеров и сжатые .so — при
      # extractNativeLibs="false" система такие не загрузит.
      - name: Проверка содержимого APK
        run: |
          set -e
          APK="$(ls app/build/outputs/apk/debug/*.apk | head -1)"
          echo "APK: $APK ($(stat -c%s "$APK") байт)"
          unzip -l "$APK"

          need() {
              unzip -l "$APK" | grep -q "$1" \
                  || { echo "✗ в APK нет $1"; exit 1; }
          }
          need 'lib/arm64-v8a/libnative-lib.so'
          need 'lib/arm64-v8a/libc++_shared.so'
          need 'assets/shaders/voxel.vert.spv'
          need 'assets/shaders/voxel.frag.spv'
          need 'AndroidManifest.xml'

          # Шейдер в APK обязан быть собран ИЗ ТЕКУЩЕГО исходника.
          #
          # Проверка дословно повторяет тот случай, ради которого
          # написана: APK нёс новый нативный код и старый voxel.frag,
          # оставленный в каталоге ассетов посторонним прогоном.
          # Собрать шейдер заново и сверить байты — единственный
          # способ увидеть это до устройства.
          rm -rf /tmp/spvchk && mkdir -p /tmp/spvchk/{ref,apk}
          for f in app/src/main/cpp/shaders/*.vert app/src/main/cpp/shaders/*.frag; do
              glslc -O "$f" -o "/tmp/spvchk/ref/$(basename "$f").spv"
          done
          unzip -q -o "$APK" 'assets/shaders/*' -d /tmp/spvchk/apk
          if ! diff -rq /tmp/spvchk/ref /tmp/spvchk/apk/assets/shaders; then
              echo "✗ шейдеры в APK не совпадают со сборкой из исходников"
              exit 1
          fi
          echo "✓ шейдеры в APK собраны из текущих исходников"

          # Метод упаковки для .so обязан быть Stored.
          BAD="$(unzip -v "$APK" | awk '/lib\/arm64-v8a\/.*\.so$/ && $2 != "Stored" {print $NF}')"
          if [ -n "$BAD" ]; then
              echo "✗ .so упакованы со сжатием, система их не загрузит:"
              echo "$BAD"
              exit 1
          fi

          SO_SIZE="$(unzip -l "$APK" | awk '/libnative-lib.so$/ {print $1}')"
          echo "libnative-lib.so: $SO_SIZE байт"
          [ "${SO_SIZE:-0}" -gt 500000 ] \
              || { echo "✗ библиотека подозрительно мала — native-сборка не отработала"; exit 1; }

          # Точка входа NativeActivity. Приходит из android_native_app_glue,
          # а это статическая библиотека: без -u ANativeActivity_onCreate
          # линковщик не вытягивает из неё ни одного объекта, потому что на
          # этот символ никто не ссылается — его ищет система через dlsym.
          # Такой APK устанавливается и падает мгновенно, без логов.
          rm -rf /tmp/apkso && mkdir -p /tmp/apkso
          unzip -q -o "$APK" 'lib/arm64-v8a/libnative-lib.so' -d /tmp/apkso
          if ! readelf --dyn-syms -W /tmp/apkso/lib/arm64-v8a/libnative-lib.so \
               | grep -qw ANativeActivity_onCreate; then
              echo "✗ в libnative-lib.so нет ANativeActivity_onCreate:"
              echo "  NativeActivity не найдёт точку входа и убьёт процесс при старте."
              exit 1
          fi
          echo "✓ APK содержит библиотеку с точкой входа, шейдеры и несжатые .so"

      - name: Выгрузка APK
        uses: actions/upload-artifact@v4
        with:
          name: VoxelRPG-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Диагностический APK: то же приложение, собранное с
      # -DVOXEL_DEBUG_SCENE=ON. У типа сборки diagnostic своя папка
      # native-сборки, поэтому обычный APK выше пересобирать не нужно.
      - name: gradle assembleDiagnostic
        run: ./gradlew assembleDiagnostic --no-daemon --stacktrace

      # APK без флага выглядит точно так же и запускает обычную игру —
      # отличить их можно только по символам в библиотеке.
      - name: Проверка диагностического APK
        run: |
          set -e
          APK="$(ls app/build/outputs/apk/diagnostic/*.apk | head -1)"
          echo "диагностический APK: $APK ($(stat -c%s "$APK") байт)"

          rm -rf /tmp/diagso && mkdir -p /tmp/diagso
          unzip -q -o "$APK" 'lib/arm64-v8a/libnative-lib.so' -d /tmp/diagso
          SO=/tmp/diagso/lib/arm64-v8a/libnative-lib.so

          if ! strings -a "$SO" | grep -q 'debug_scene=true (build diagnostic mode)'; then
              echo "✗ в диагностическом APK нет объявления режима:"
              echo "  значит VOXEL_DEBUG_SCENE до компилятора не доехал."
              exit 1
          fi

          # И симметрично: обычный APK обязан остаться обычным.
          rm -rf /tmp/normso && mkdir -p /tmp/normso
          unzip -q -o "$(ls app/build/outputs/apk/debug/*.apk | head -1)" \
                'lib/arm64-v8a/libnative-lib.so' -d /tmp/normso
          if strings -a /tmp/normso/lib/arm64-v8a/libnative-lib.so \
             | grep -q 'debug_scene=true (build diagnostic mode)'; then
              echo "✗ обычный APK тоже собран диагностическим"
              exit 1
          fi
          echo "✓ диагностический APK объявляет режим, обычный — нет"

          # Неподписанный APK собирается молча и не ставится на
          # устройство: у своего типа сборки нет автоматического
          # отладочного ключа.
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1)"
          if [ -n "$APKSIGNER" ]; then
              "$APKSIGNER" verify --print-certs "$APK" > /tmp/diagsig.txt 2>&1 \
                  || { echo "✗ диагностический APK не подписан:";
                       cat /tmp/diagsig.txt; exit 1; }
              echo "✓ диагностический APK подписан"
          else
              echo "apksigner не найден — подпись не проверена"
          fi

      - name: Выгрузка диагностического APK
        uses: actions/upload-artifact@v4
        with:
          name: VoxelRPG-diagnostic
          path: app/build/outputs/apk/diagnostic/*.apk
          if-no-files-found: error

      # Несжатая библиотека нужна, чтобы расшифровать адреса из отчёта
      # о падении: tools/symbolize.sh работает именно по ней.
      - name: Выгрузка неурезанной библиотеки
        uses: actions/upload-artifact@v4
        with:
          name: VoxelRPG-symbols
          path: app/build/intermediates/cxx/**/libnative-lib.so
          if-no-files-found: warn

  # Артефакты прогона скачиваются только из веб-интерфейса и только
  # авторизованным пользователем — с телефона это неудобно. Поэтому тот
  # же APK кладётся в релиз latest-apk: у него постоянный прямой адрес,
  # который берётся curl'ом прямо в Termux.
  release:
    name: Ссылка на готовый APK
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VoxelRPG-debug
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: VoxelRPG-diagnostic
          path: diag

      - uses: actions/download-artifact@v4
        with:
          name: VoxelRPG-symbols
          path: symbols
        continue-on-error: true

      - name: Обновить релиз latest-apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mv dist/*.apk VoxelRPG-debug.apk
          mv diag/*.apk VoxelRPG-diagnostic.apk
          FILES="VoxelRPG-debug.apk VoxelRPG-diagnostic.apk"
          SO="$(find symbols -name 'libnative-lib.so' 2>/dev/null | head -1)"
          if [ -n "$SO" ]; then
              cp "$SO" libnative-lib-unstripped.so
              gzip -f libnative-lib-unstripped.so
              FILES="$FILES libnative-lib-unstripped.so.gz"
          fi

          NOTES="Отладочный APK, собранный автоматически.

          Ветка: ${{ github.ref_name }}
          Коммит: ${{ github.sha }}

          Обычная игра:

              curl -L -o VoxelRPG.apk https://github.com/${{ github.repository }}/releases/download/latest-apk/VoxelRPG-debug.apk
              termux-open VoxelRPG.apk

          Диагностическая сцена — запускается сразу, settings.cfg править не нужно:

              curl -L -o VoxelRPG-diag.apk https://github.com/${{ github.repository }}/releases/download/latest-apk/VoxelRPG-diagnostic.apk
              termux-open VoxelRPG-diag.apk

          Диагностический APK видно по первой же строке журнала:
          'debug_scene=true (build diagnostic mode)'.

          Рядом лежит неурезанная библиотека для tools/symbolize.sh."

          if gh release view latest-apk --repo "${{ github.repository }}" >/dev/null 2>&1; then
              gh release upload latest-apk $FILES --repo "${{ github.repository }}" --clobber
              gh release edit latest-apk --repo "${{ github.repository }}" --notes "$NOTES"
          else
              gh release create latest-apk $FILES \
                  --repo "${{ github.repository }}" \
                  --title "Последняя сборка" \
                  --notes "$NOTES" \
                  --prerelease
          fi

          echo "Прямые ссылки:"
          echo "  обычная игра:  https://github.com/${{ github.repository }}/releases/download/latest-apk/VoxelRPG-debug.apk"
          echo "  диагностика:   https://github.com/${{ github.repository }}/releases/download/latest-apk/VoxelRPG-diagnostic.apk"
