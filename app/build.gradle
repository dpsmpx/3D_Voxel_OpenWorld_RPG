plugins {
    id 'com.android.application'
}

android {
    namespace 'com.voxelrpg.game'
    compileSdk 34
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId "com.voxelrpg.game"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // Только ARM64 — минимальный размер APK, максимум производительности.
        ndk {
            abiFilters 'arm64-v8a'
        }

        // Оставляем .so несжатыми — быстрее загрузка.
        packagingOptions {
            jniLibs {
                useLegacyPackaging = false
            }
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20 -fno-exceptions -fno-rtti"
                arguments "-DANDROID_STL=c++_shared",
                          "-DANDROID_ARM_NEON=ON"
                abiFilters 'arm64-v8a'
            }
        }
    }

    // ---- Подпись debug ----
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            // Если файл release.keystore отсутствует, используем debug.
            // Создайте release.keystore через keytool перед публикацией.
            def releaseStoreFile = file("release.keystore")
            if (releaseStoreFile.exists()) {
                storeFile releaseStoreFile
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD") ?: "release"
                keyAlias System.getenv("RELEASE_KEY_ALIAS") ?: "release"
                keyPassword System.getenv("RELEASE_KEY_PASSWORD") ?: "release"
            } else {
                storeFile file("debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            signingConfig signingConfigs.debug
            jniDebuggable true
        }
        release {
            debuggable false
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
            ndk {
                // Символы не сохраняем в release.
                debugSymbolLevel 'none'
            }
        }
    }

    sourceSets {
        main {
            // Native библиотека собирается CMake, но jniLibs — fallback
            // если мы хотим предсобранные .so класть вручную (см. build.sh).
            jniLibs.srcDirs = ['src/main/jniLibs']
            assets.srcDirs  = ['src/main/assets']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Отключаем Lint — у нас нет Java-кода.
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // NativeActivity и android_native_app_glue — часть NDK,
    // отдельные зависимости не нужны.
}