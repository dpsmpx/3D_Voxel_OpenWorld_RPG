plugins {
    id 'com.android.application'
}


// ============================================================
//  Шейдеры: их компилирует сама сборка APK
// ============================================================
//
// Раньше gradle паковал app/src/main/assets/shaders как есть, а .spv
// туда клал «кто-то раньше»: build.sh, tools/vkcheck/run.sh,
// tools/gpubench/run.sh. Файлы не в git (см. .gitignore), так что в
// APK уезжало содержимое рабочего каталога на момент сборки.
//
// Этим и вышел молчаливый обман: прогон A/B картинки собрал шейдеры
// из git stash — то есть СТАРЫЕ, — а следом ./gradlew assemble упаковал
// их в APK вместе с новым нативным кодом. Сборка уехала на устройство,
// замер повторил прежние числа, и заметить это можно было только по
// размеру SPIR-V в журнале.
//
// Теперь исходник шейдера — единственный источник того, что лежит в
// APK. Каталог собирается заново на каждый прогон задачи: файл,
// оставшийся от прошлого раза или положенный чужой рукой, не
// переживает сборку.
def shaderSourceDir = file('src/main/cpp/shaders')
def shaderAssetsDir = new File(buildDir, 'generated/shaderAssets')

def compileShaders = tasks.register('compileShaders') {
    description = 'GLSL -> SPIR-V (glslc -O) для APK'
    group = 'build'
    inputs.dir(shaderSourceDir).withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.dir(shaderAssetsDir)
    doLast {
        def outDir = new File(shaderAssetsDir, 'shaders')
        delete(shaderAssetsDir)
        outDir.mkdirs()

        def sources = (shaderSourceDir.listFiles() ?: new File[0])
                .findAll { it.name.endsWith('.vert') || it.name.endsWith('.frag') }
                .sort { it.name }
        if (sources.isEmpty())
            throw new GradleException("шейдеров не найдено в $shaderSourceDir")

        sources.each { src ->
            def dst = new File(outDir, src.name + '.spv')
            def proc
            try {
                proc = new ProcessBuilder('glslc', '-O',
                                          src.absolutePath, '-o', dst.absolutePath)
                        .redirectErrorStream(true).start()
            } catch (IOException e) {
                throw new GradleException(
                    'glslc не найден — без него APK собрать нельзя.\n' +
                    '    Termux: pkg install shaderc\n' +
                    '    Debian: apt-get install glslc', e)
            }
            def log = proc.inputStream.text
            if (proc.waitFor() != 0)
                throw new GradleException("glslc не смог собрать ${src.name}:\n$log")
            // Предупреждение glslc — это ошибка в шейдере, которую
            // иначе увидишь только чёрным экраном на устройстве.
            if (log.trim())
                throw new GradleException("glslc ругается на ${src.name}:\n$log")
        }
        logger.lifecycle("шейдеров собрано: ${sources.size()} -> $outDir")
    }
}

// Ассеты сливаются до упаковки — задача обязана отработать раньше.
tasks.matching { it.name ==~ /merge.*Assets/ }.configureEach {
    dependsOn compileShaders
}
tasks.matching { it.name == 'preBuild' }.configureEach {
    dependsOn compileShaders
}

android {
    namespace 'com.voxelrpg.game'
    compileSdk 34
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId "com.voxelrpg.game"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // Только ARM64 — минимальный размер APK, максимум производительности.
        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20 -fno-exceptions -fno-rtti"
                arguments "-DANDROID_STL=c++_shared",
                          "-DANDROID_ARM_NEON=ON"
                abiFilters 'arm64-v8a'
            }
        }
    }

    // .so остаются несжатыми и выровненными: манифест объявляет
    // extractNativeLibs="false", библиотека грузится прямо из APK.
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    // ---- Подпись ----
    signingConfigs {
        debug {
            // Ключ не в репозитории (см. .gitignore). Если его нет,
            // gradle подставит собственный отладочный ключ.
            def debugStore = file("debug.keystore")
            if (debugStore.exists()) {
                storeFile debugStore
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
        release {
            // Если файл release.keystore отсутствует, используем debug.
            // Создайте release.keystore через keytool перед публикацией.
            def releaseStoreFile = file("release.keystore")
            if (releaseStoreFile.exists()) {
                storeFile releaseStoreFile
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD") ?: "release"
                keyAlias System.getenv("RELEASE_KEY_ALIAS") ?: "release"
                keyPassword System.getenv("RELEASE_KEY_PASSWORD") ?: "release"
            } else {
                storeFile file("debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            jniDebuggable true
            if (file("debug.keystore").exists()) {
                signingConfig signingConfigs.debug
            }
        }
        release {
            debuggable false
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
            ndk {
                // Символы не сохраняем в release.
                debugSymbolLevel 'none'
            }
        }

        // Диагностический APK: то же приложение, но собранное с
        // -DVOXEL_DEBUG_SCENE=ON. Флаг времени компиляции, а не
        // настройка: settings.cfg на свежем устройстве отсутствует, и
        // полагаться на его ручную правку нельзя.
        //
        // Отдельный тип сборки, а не ключ командной строки, затем что
        // у него своя папка native-сборки: обычный и диагностический
        // APK собираются в одном прогоне и не мешают друг другу.
        diagnostic {
            initWith debug
            matchingFallbacks = ['debug']
            versionNameSuffix "-diag"
            // Подпись задаём явно. Автоматический отладочный ключ
            // AGP подставляет только типу сборки с именем debug; свой
            // тип без этой строки даёт НЕПОДПИСАННЫЙ APK, а такой не
            // ставится на устройство — и узнали бы мы об этом только
            // при установке.
            signingConfig signingConfigs.debug
            externalNativeBuild {
                cmake {
                    arguments "-DVOXEL_DEBUG_SCENE=ON"
                }
            }
        }
    }

    sourceSets {
        main {
            // Native библиотека собирается CMake, но jniLibs — fallback
            // если мы хотим предсобранные .so класть вручную (см. build.sh).
            jniLibs.srcDirs = ['src/main/jniLibs']
            // Ассеты берутся ТОЛЬКО из каталога сборки, куда их кладёт
            // задача compileShaders (см. ниже). Каталог src/main/assets
            // в APK больше не попадает — и не может его испортить.
            assets.srcDirs  = [shaderAssetsDir]
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Java в проекте ровно один класс — активность с системным
    // выбором файла. Полный lint на нём только шумит.
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // NativeActivity и android_native_app_glue — часть NDK,
    // отдельные зависимости не нужны.
}